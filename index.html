button { border: 0; background: var(--accent); color: var(--surface); font-weight: 600; cursor: pointer; }

const bytes = s => Uint8Array.from(atob(s), ch => ch.charCodeAt(0));
async function unlock(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: bytes(SALT), iterations: ITER, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(IV) }, key, bytes(DATA));
  return new TextDecoder().decode(plain);
}
async function show(pw, fromForm) {
  try {
    const html = await unlock(pw);
    try { sessionStorage.setItem("ccm-pw", pw); } catch (e) {}
    document.open(); document.write(html); document.close();
  } catch (e) {
    if (fromForm) document.getElementById("msg").textContent = "That password didn't work. Check it and try again.";
  }
}
document.getElementById("f").addEventListener("submit", e => {
  e.preventDefault();
  document.getElementById("msg").textContent = "Unlocking...";
  show(document.getElementById("pw").value, true);
});
try { const saved = sessionStorage.getItem("ccm-pw"); if (saved) show(saved, false); } catch (e) {}
