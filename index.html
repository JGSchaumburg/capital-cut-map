<style>
:root { --bg: #f5f6f3; --surface: #fff; --ink: #1b2430; --muted: #55606d; --line: #d9ddd6; --accent: #1f6f64; --bad: #b23f2b; }

body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 17px/1.5 "Public Sans", "Segoe UI", Arial, sans-serif; padding-inline: 16px; }
form { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 28px; width: min(100%, 380px); display: grid; gap: 14px; box-sizing: border-box; }
h1 { margin: 0; font-size: 26px; }
p { margin: 0; color: var(--muted); font-size: 16px; }
input, button { font: inherit; padding: 10px 12px; border-radius: 8px; box-sizing: border-box; width: 100%; }
input { border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
button { border: 0; background: var(--accent); color: var(--surface); font-weight: 600; cursor: pointer; }
#msg { color: var(--bad); min-height: 1.5em; }
</style>

const bytes = s => Uint8Array.from(atob(s), ch => ch.charCodeAt(0));
async function unlock(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: bytes(SALT), iterations: ITER, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(IV) }, key, bytes(DATA));
  return new TextDecoder().decode(plain);
}
async function show(pw, fromForm) {
  try {
    const html = await unlock(pw);
    try { sessionStorage.setItem("pwpages", pw); } catch (e) {}
    document.open(); document.write(html); document.close();
  } catch (e) {
    if (fromForm) document.getElementById("msg").textContent = "That password didn't work. Check it and try again.";
  }
}
document.getElementById("f").addEventListener("submit", e => {
  e.preventDefault();
  document.getElementById("msg").textContent = "Unlocking...";
  show(document.getElementById("pw").value, true);
});
try { const saved = sessionStorage.getItem("pwpages"); if (saved) show(saved, false); } catch (e) {}
